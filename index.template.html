<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="description" content="启能力 ERP · 一条主线串起采购、寻源、履约、仓存与财务的企业协同工作台">
<title>启能力 ERP · 工作台</title>
<link rel="stylesheet" href="styles.css">
</head>
<body>

<!-- 登录 -->
<div id="loginView" class="login-view">
  <div class="login-brand">
    <div class="login-brand-inner">
      <div class="login-logo"><span class="logo-mark">启</span><span>启能力 ERP</span></div>
      <h1>把复杂流程，<br>变成一件件能办完的事。</h1>
      <p class="login-slogan">八个环节 · 一条主线 · 每个角色只看自己该做的事</p>
      <div class="login-steps">
        <span>提出需求</span><i></i><span>寻源定标</span><i></i><span>交付入库</span><i></i><span>对账结算</span>
      </div>
      <div class="login-brand-foot">启能力企业协同工作台</div>
    </div>
  </div>
  <div class="login-panel">
    <div class="login-card">
      <h2>欢迎回来</h2>
      <p class="login-sub">选择你的身份，进入对应的工作台</p>
      <div class="login-roles" id="loginRoles"></div>
      <p class="login-note">演示环境无需密码。不同身份看到的功能与单据范围不同，数据保存在当前浏览器。</p>
    </div>
  </div>
</div>

<!-- 主应用 -->
<div id="appView" class="app-view hidden">
  <aside class="sidebar" id="sidebar">
    <div class="sb-brand">
      <div class="sb-logo"><span class="logo-mark">启</span></div>
      <div class="sb-brand-text"><b>启能力 ERP</b><span id="sbSlogan">企业协同工作台</span></div>
    </div>
    <nav class="sb-scroll" id="sbNav"></nav>
    <div class="sb-foot">
      <div class="sb-user"><span class="avatar" id="sbAvatar">张</span><span class="sb-user-text"><b id="sbRole">超级管理员</b><i id="sbPerson">张账号</i></span></div>
      <button class="sb-logout" id="logoutBtn" title="退出登录 / 切换身份">退出</button>
    </div>
  </aside>

  <div class="main-wrap">
    <header class="topbar">
      <button class="icon-btn sb-toggle" id="sbToggle" title="展开 / 收起导航" aria-label="切换导航"></button>
      <div class="crumb" id="crumb"></div>
      <div class="top-actions">
        <div class="global-search">
          <span class="gs-icon" aria-hidden="true"></span>
          <input id="globalSearch" type="search" placeholder="搜索我的单据" autocomplete="off">
          <div class="gs-results hidden" id="gsResults"></div>
        </div>
        <button class="icon-btn bell-btn" id="bellBtn" title="通知" aria-label="通知">
          <span class="bell-svg" aria-hidden="true"></span><i class="badge hidden" id="bellBadge">0</i>
        </button>
        <button class="role-chip" id="roleChip" title="切换身份">
          <span class="avatar" id="topAvatar">张</span><b id="topRole">超级管理员</b><span class="caret"></span>
        </button>
        <div class="role-menu hidden" id="roleMenu"></div>
      </div>
    </header>
    <main class="content" id="content"></main>
  </div>
</div>

<!-- 抽屉：新建 / 编辑 / 详情 -->
<div class="drawer-overlay hidden" id="drawerOverlay"></div>
<section class="drawer hidden" id="drawer" role="dialog" aria-modal="true">
  <div class="drawer-head">
    <button class="drawer-back" id="drawerBack">返回</button>
    <div class="drawer-title"><h3 id="drawerTitle">标题</h3><p id="drawerSub">副标题</p></div>
    <button class="icon-btn" id="drawerClose" aria-label="关闭"></button>
  </div>
  <div class="drawer-body" id="drawerBody"></div>
  <div class="drawer-foot" id="drawerFoot"></div>
</section>

<!-- 轻量弹层：二维码 / 确认框 -->
<div class="modal-layer hidden" id="modalLayer"><div class="modal" id="modal"></div></div>

<div class="toast-wrap" id="toastWrap"></div>

<script src="data.js"></script>
<script src="config.js"></script>
<script src="contract.js"></script>
<script src="qr.js"></script>
<script src="engine.js"></script>
<script src="sync.js"></script>
<script src="app.js"></script>
</body>
</html>
